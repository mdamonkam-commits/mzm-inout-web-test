<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MZM 进出货记录 Preview</title>
<style>
:root{--bg:#f7efe5;--panel:#fffdf9;--head:#eadfce;--line:#dfd0bb;--text:#2b1d13;--muted:#8a7058;--green:#10a957;--blue:#0b62e0;--red:#e60023;--amber:#a16207}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Noto Sans SC",sans-serif;color:var(--text);font-size:13px}.wrap{padding:20px;max-width:1700px;margin:0 auto}.top{margin-bottom:14px}.top h1{font-size:22px;margin:0}.top p{margin:5px 0 0;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.card{background:#fffdf9;border:1px solid #dfd0bb;border-radius:13px;padding:13px 15px}.label{color:#8a7058;font-size:12px}.num{font-size:24px;font-weight:800;margin-top:4px}.panel{background:#fffdf9;border:1px solid #dfd0bb;border-radius:14px;overflow:hidden;box-shadow:0 8px 20px rgba(120,84,45,.06);margin-bottom:14px}.toolbar{background:#f1e5d4;border-bottom:1px solid #dfd0bb;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.toolbar strong{font-size:16px}.btn{background:#10a957;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.light{background:#fffaf2;border:1px solid #d4bea5;color:#3a281b}.btn.danger{background:#fff1f1;color:var(--red);border:1px solid #ffcaca}.form{padding:18px 18px 10px}.main-row{display:grid;grid-template-columns:145px 190px 90px 110px 145px 125px 145px minmax(220px,1fr) 88px;gap:14px;align-items:end}.field label{display:block;color:#70583f;font-size:12px;margin-bottom:6px;white-space:nowrap}.field input,.field select{width:100%;border:1px solid #d4bea5;border-radius:9px;background:#fff;padding:9px 10px;font:inherit;min-height:38px}.note{padding:0 18px 14px;color:#8a7058;font-size:12px}.tools{display:flex;gap:8px;align-items:center}.search{width:280px;border:1px solid #d4bea5;border-radius:18px;padding:9px 13px;background:#fffdf9}.table-wrap{overflow:auto;max-height:58vh}table{width:100%;min-width:1300px;border-collapse:collapse}th{background:#eadfce;color:#70583f;font-size:12px;font-weight:600;text-align:left;padding:11px 12px;white-space:nowrap;border-bottom:1px solid #dfd0bb}td{padding:11px 12px;border-bottom:1px solid #eadfce;white-space:nowrap;font-size:13px;vertical-align:middle}tr:hover{background:#fff8ef}.clickable{cursor:pointer}.tag{display:inline-flex;padding:5px 8px;border-radius:7px;font-weight:700;font-size:12px}.done,.in,.bulk{background:#dff8ea;color:#078245}.pending,.borrow{background:#fff3d8;color:#a16207}.out,.invoice{background:#e8f1ff;color:#0b62e0}.sample{background:#f3e8ff;color:#7e22ce}.exchange{background:#e8fff8;color:#047857}.other{background:#f1f5f9;color:#475569}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700}.money{font-weight:800;color:#0b8f4d}.muted{color:#9a8067}.remark-cell{max-width:260px;overflow:hidden;text-overflow:ellipsis}.footer{display:flex;justify-content:space-between;padding:12px 14px;color:#80664d;background:#fffdf9}.small{font-size:12px;padding:7px 10px;min-height:auto}.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(43,29,19,.38);display:none;align-items:center;justify-content:center;z-index:20;padding:18px}.modal.show{display:flex}.dialog{width:min(520px,100%);background:#fffdf9;border:1px solid #dfd0bb;border-radius:16px;box-shadow:0 24px 80px rgba(43,29,19,.25);overflow:hidden}.dialog-head{background:#f1e5d4;border-bottom:1px solid #dfd0bb;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}.dialog-head h2{font-size:17px;margin:0}.dialog-body{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.dialog-body .field.full{grid-column:span 2}.dialog-foot{padding:14px 18px;border-top:1px solid #eadfce;display:flex;justify-content:flex-end;gap:8px}@media(max-width:900px){.wrap{padding:12px}.summary{grid-template-columns:repeat(2,1fr)}.toolbar{flex-direction:column;align-items:stretch;gap:10px}.tools{flex-wrap:wrap}.search{width:100%}.main-row{grid-template-columns:1fr 1fr}.main-row .save-field{grid-column:span 2}.btn{width:100%}table{min-width:1180px}}
</style>
</head><body>
<div class="wrap">
<div class="top"><h1>MZM 进出货记录</h1><p>测试版：主填写顺序按你现在 Excel 习惯整理</p></div>
<div class="summary"><div class="card"><div class="label">未完成数量</div><div class="num" id="sumPending">0</div></div><div class="card"><div class="label">出货未开单数量</div><div class="num" id="sumOutUnbilled">0</div></div><div class="card"><div class="label">进货未开单数量</div><div class="num" id="sumInUnbilled">0</div></div><div class="card"><div class="label">需收回邮费</div><div class="num" id="sumPostage">RM 0.00</div></div></div>
<section class="panel"><div class="toolbar"><strong id="formTitle">新增记录</strong><button class="btn light hidden" id="cancelEditBtn">取消编辑</button></div><form id="form" class="form"><input type="hidden" id="id"><div class="main-row"><div class="field"><label>产品系统 必填</label><select id="productLine" required><option>TO</option><option>TFF</option><option>GE</option><option>Other</option></select></div><div class="field"><label>Item 代号 必填</label><input id="item" list="itemList" placeholder="选择或输入代号" required><datalist id="itemList"></datalist></div><div class="field"><label>Qty 必填</label><input id="qty" type="number" min="1" step="1" required placeholder="1"></div><div class="field"><label>In / Out 必填</label><select id="direction" required><option value="Out">Out</option><option value="In">In</option></select></div><div class="field"><label>Branch 必填</label><input id="branch" list="branchList" placeholder="选择 Branch" required><datalist id="branchList"></datalist></div><div class="field"><label>类型 必填</label><select id="type" required><option>开单</option><option>借</option><option>大货</option><option>Sample</option><option>换货</option><option>其他</option></select></div><div class="field"><label>Tracking No</label><input id="tracking" placeholder="Tracking"></div><div class="field"><label>Remark</label><input id="remark" placeholder="备注"></div><div class="field save-field"><label>&nbsp;</label><button class="btn" type="submit" id="saveBtn">保存</button></div></div></form><div class="note">日期会自动记录为今天；完成状态、开单状态、邮费可在记录列表点进去后补。</div></section>
<section class="panel"><div class="toolbar"><strong>记录列表</strong><div class="tools"><input class="search" id="search" placeholder="搜索 产品 / Branch / 类型 / 备注"><button class="btn light" id="exportBtn">导出 CSV</button><button class="btn light" id="resetBtn">恢复示例</button></div></div><div class="table-wrap"><table><thead><tr><th>日期</th><th>产品系统</th><th>Item 代号</th><th>Qty</th><th>In / Out</th><th>Branch</th><th>类型</th><th>Tracking No</th><th>Remark</th><th>完成状态</th><th>开单状态</th><th>邮费</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="footer"><span id="countText">0 条记录</span><span>点记录行可补完成状态、开单状态、邮费</span></div></section>
</div>
<div class="modal" id="statusModal"><div class="dialog"><div class="dialog-head"><h2>完成 / 开单 / 邮费</h2><button class="btn light" id="statusCloseBtn">关闭</button></div><form id="statusForm"><input type="hidden" id="statusId"><div class="dialog-body"><div class="field full"><label>记录</label><input id="statusRecordInfo" readonly></div><div class="field"><label>完成状态</label><select id="statusCompleted"><option value="false">未完成</option><option value="true">完成</option></select></div><div class="field"><label>开单状态</label><select id="statusBill"><option>未开单</option><option>已开单</option><option>不需要</option></select></div><div class="field"><label>邮费</label><input id="statusPostage" type="number" min="0" step="0.01" placeholder="5.62"></div><div class="field"><label>&nbsp;</label><span class="muted">帮其他 Branch 出货给顾客才填。</span></div></div><div class="dialog-foot"><button class="btn light" type="button" id="statusCancelBtn">取消</button><button class="btn" type="submit">保存</button></div></form></div></div>
<script>
const KEY='mzm_inout_correct_layout_v2';function makeId(){return 'r'+Math.random().toString(36).slice(2)+Date.now().toString(36)}
const sample=[{id:makeId(),date:'2026-07-28',completed:false,billStatus:'未开单',productLine:'TO',item:'EMBC',branch:'JING',direction:'Out',type:'开单',qty:'1',tracking:'MY123456',postage:'5.62',remark:'帮忙出货给顾客'},{id:makeId(),date:'2026-07-29',completed:false,billStatus:'未开单',productLine:'TFF',item:'TFF',branch:'SUMMER',direction:'Out',type:'借',qty:'2',tracking:'MY888222',postage:'6.20',remark:'先借给 Summer'},{id:makeId(),date:'2026-07-30',completed:false,billStatus:'未开单',productLine:'GE',item:'GE',branch:'MZM',direction:'In',type:'大货',qty:'10',tracking:'',postage:'',remark:'MZM order 到货'},{id:makeId(),date:'2026-07-31',completed:true,billStatus:'不需要',productLine:'Other',item:'TEMP-GIFT-001',branch:'BERRY',direction:'Out',type:'Sample',qty:'1',tracking:'',postage:'',remark:'新赠品临时代号'}];
const productItems={'TO':['EMBC','TO-001','TO-GIFT','TO-SAMPLE'],'TFF':['TFF','TFF-001','TFF-GIFT','TFF-SAMPLE'],'GE':['GE','GE-001','GE-GIFT','GE-SAMPLE'],'Other':['TEMP-GIFT-001','NEW-GIFT','待确认']};const branchOptions={'TO':['JOEY','JING','BERRY','MAYMAY','SUMMER','ANGELLIAN','SIEW LI','EVEN','SUMMER XIA','OTHER'],'TFF':['JOEY','JING','BERRY','MAYMAY','ALLEN','SUMMER','OTHER'],'GE':['JOEY','JING','BERRY','MAYMAY','SUMMER','ANGELLIAN','EVEN','OTHER'],'Other':['JOEY','JING','BERRY','MAYMAY','SUMMER','OTHER']};let records=[];
function load(){records=JSON.parse(localStorage.getItem(KEY)||'null')||sample;save()}function save(){localStorage.setItem(KEY,JSON.stringify(records))}function money(v){const n=parseFloat(v);return isNaN(n)?'':`RM${n.toFixed(2)}`}function fmtDate(v){if(!v)return '';const [y,m,d]=v.split('-');return `${d}/${m}/${y}`}function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function typeClass(t){if(t==='借')return 'borrow';if(t==='开单')return 'invoice';if(t==='大货')return 'bulk';if(t==='Sample')return 'sample';if(t==='换货')return 'exchange';return 'other'}function updateLists(){const line=productLine.value;itemList.innerHTML=(productItems[line]||[]).map(x=>`<option value="${esc(x)}"></option>`).join('');branchList.innerHTML=(branchOptions[line]||[]).map(x=>`<option value="${esc(x)}"></option>`).join('');item.placeholder=line==='Other'?'输入临时代号':'选择或输入代号'}function filtered(){const q=search.value.trim().toLowerCase();if(!q)return records;return records.filter(r=>Object.values(r).join(' ').toLowerCase().includes(q))}
function render(){const rows=filtered();tbody.innerHTML=rows.map(r=>`<tr class="clickable" onclick="openStatusModal('${r.id}')"><td>${fmtDate(r.date)}</td><td>${esc(r.productLine)}</td><td class="code">${esc(r.item)}</td><td>${esc(r.qty)}</td><td><span class="tag ${r.direction==='In'?'in':'out'}">${esc(r.direction)}</span></td><td>${esc(r.branch)}</td><td><span class="tag ${typeClass(r.type)}">${esc(r.type)}</span></td><td class="code">${esc(r.tracking)||'<span class="muted">-</span>'}</td><td class="remark-cell">${esc(r.remark)||'<span class="muted">-</span>'}</td><td>${r.completed?'<span class="tag done">完成</span>':'<span class="tag pending">未完成</span>'}</td><td>${esc(r.billStatus||'未开单')}</td><td class="money">${money(r.postage)||'<span class="muted">-</span>'}</td><td><button class="btn light small" onclick="event.stopPropagation();editRecord('${r.id}')">编辑</button> <button class="btn danger small" onclick="event.stopPropagation();delRecord('${r.id}')">删除</button></td></tr>`).join('');countText.textContent=`${rows.length} 条记录`;sumPending.textContent=records.filter(r=>!r.completed).reduce((s,r)=>s+(parseFloat(r.qty)||0),0);sumOutUnbilled.textContent=records.filter(r=>r.direction==='Out'&&(r.billStatus||'未开单')==='未开单').reduce((s,r)=>s+(parseFloat(r.qty)||0),0);sumInUnbilled.textContent=records.filter(r=>r.direction==='In'&&(r.billStatus||'未开单')==='未开单').reduce((s,r)=>s+(parseFloat(r.qty)||0),0);sumPostage.textContent=`RM ${records.filter(r=>r.direction==='Out').reduce((s,r)=>s+(parseFloat(r.postage)||0),0).toFixed(2)}`}
function clearForm(){form.reset();id.value='';productLine.value='TO';direction.value='Out';type.value='开单';updateLists();formTitle.textContent='新增记录';saveBtn.textContent='保存';cancelEditBtn.classList.add('hidden')}function setForm(r){id.value=r.id;productLine.value=r.productLine||'TO';updateLists();item.value=r.item||'';qty.value=r.qty||'';direction.value=r.direction||'Out';branch.value=r.branch||'';type.value=r.type||'开单';tracking.value=r.tracking||'';remark.value=r.remark||''}function getForm(){return {id:id.value||makeId(),date:new Date().toISOString().slice(0,10),productLine:productLine.value,item:item.value.trim(),qty:qty.value,direction:direction.value,branch:branch.value.trim(),type:type.value,tracking:tracking.value.trim(),remark:remark.value.trim(),completed:false,billStatus:'未开单',postage:''}}
window.editRecord=rid=>{const r=records.find(x=>x.id===rid);if(!r)return;setForm(r);formTitle.textContent='编辑记录';saveBtn.textContent='更新';cancelEditBtn.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};window.delRecord=rid=>{if(!confirm('确定删除这笔记录？'))return;records=records.filter(r=>r.id!==rid);save();render()};function openStatusModal(rid){const r=records.find(x=>x.id===rid);if(!r)return;statusId.value=r.id;statusRecordInfo.value=`${r.productLine} / ${r.item} / ${r.qty} / ${r.direction} / ${r.branch}`;statusCompleted.value=String(!!r.completed);statusBill.value=r.billStatus||'未开单';statusPostage.value=r.postage||'';statusModal.classList.add('show')}function closeStatusModal(){statusModal.classList.remove('show')}statusCloseBtn.onclick=closeStatusModal;statusCancelBtn.onclick=closeStatusModal;statusForm.onsubmit=e=>{e.preventDefault();const r=records.find(x=>x.id===statusId.value);if(!r)return;r.completed=statusCompleted.value==='true';r.billStatus=statusBill.value;r.postage=statusPostage.value;save();render();closeStatusModal()};
form.onsubmit=e=>{e.preventDefault();const r=getForm();if(!r.productLine||!r.item||!r.qty||!r.direction||!r.branch||!r.type){alert('请填写所有必填项目');return}const i=records.findIndex(x=>x.id===r.id);if(i>=0){records[i]={...records[i],...r}}else records.unshift(r);save();clearForm();render()};productLine.onchange=updateLists;search.oninput=render;cancelEditBtn.onclick=clearForm;resetBtn.onclick=()=>{if(confirm('恢复示例会清除目前浏览器里的记录，确定？')){records=sample;save();clearForm();render()}};exportBtn.onclick=()=>{const headers=['日期','产品系统','Item代号','Qty','In/Out','Branch','类型','Tracking No','Remark','完成状态','开单状态','邮费'];const csv=[headers.join(',')].concat(records.map(r=>[r.date,r.productLine,r.item,r.qty,r.direction,r.branch,r.type,r.tracking||'',r.remark,r.completed?'完成':'未完成',r.billStatus||'未开单',r.postage||''].map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(','))).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='MZM_进出货记录.csv';a.click();URL.revokeObjectURL(a.href)};load();clearForm();render();
</script></body></html>
