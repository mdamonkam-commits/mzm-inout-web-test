<div class="wrap">
<div class="top"><h1>MZM 进出货记录</h1><p>测试版：完成日期只在 Admin 标记已完成后显示</p></div>

<section class="panel"><div class="toolbar"><strong>记录列表</strong><div class="tools"><input class="search" id="search" placeholder="搜索 产品 / Branch / 类型 / 备注"><button class="btn light" id="undoBtn" type="button" title="返回上一个动作" aria-label="返回上一个动作">↶</button><button class="btn light" id="exportBtn">导出 CSV</button><button class="btn light" id="resetBtn">恢复示例</button></div></div><div class="category-tabs" id="categoryTabs"></div><div class="table-wrap"><table><thead><tr><th>完成日期</th><th>产品系统</th><th>Item 代号</th><th>Qty</th><th>In / Out</th><th>类型</th><th>Branch</th><th>Tracking / Delivery</th><th>Remark</th><th>完成状态</th><th>开单状态</th><th>邮费</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="footer"><span id="countText">0 条记录</span><span></span></div></section>
</div>
<div class="modal" id="statusModal"><div class="dialog"><div class="dialog-head"><h2>记录状态 / 开单资料</h2><button class="btn light" id="statusCloseBtn">关闭</button></div><form id="statusForm"><input type="hidden" id="statusId"><div class="dialog-body"><div class="field"><label>产品系统</label><select id="modalProductLine"><option>TO</option><option>TFF</option><option>GE</option><option>Other</option></select></div><div class="field"><label>Item 代号</label><input id="modalItem"></div><div class="field"><label>Qty</label><input id="modalQty" type="number" min="1" step="1"></div><div class="field"><label>In / Out</label><select id="modalDirection"><option value="Out">Out</option><option value="In">In</option></select></div><div class="field"><label>类型</label><select id="modalType"><option>开单</option><option>借</option><option>大货</option><option>Sample</option><option>换货</option><option>其他</option></select></div><div class="field" id="modalBranchField"><label>Branch</label><select id="modalBranch"></select></div><div class="field wide"><label>Remark</label><textarea id="modalRemark" placeholder="备注可多行"></textarea></div><div class="field wide"><label>Tracking / Delivery（可多行，列表只显示第一行）</label><textarea id="statusTracking" placeholder="NVMY...&#10;lalamove&#10;self collect"></textarea></div><div class="field"><label>完成状态（Admin 填）</label><select id="statusCompleted"><option value="false">未完成</option><option value="true">已完成</option></select></div><div class="field"><label>完成日期</label><input id="statusCompletionDate" type="date"></div><div class="field"><label>开单状态</label><select id="statusBill"><option>未开单</option><option>已开单</option><option>不需要</option></select></div><div class="field"><label>邮费</label><input id="statusPostage" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="field"><label>&nbsp;</label><span class="muted">帮其他 Branch 出货给顾客才填。</span></div><div class="invoice-extra hidden" id="invoiceExtra"><div class="field full"><label>Invoice No（可多行，一行一个）</label function load(){let raw=localStorage.getItem(KEY);if(!raw){for(const k of OLD_KEYS){const old=localStorage.getItem(k);if(old){raw=old;break}}}records=JSON.parse(raw||'null')||sample;records=records.map(r=>({invoiceNo:'',paymentDate:'',billDate:'',completionDate:r.completed?(r.completionDate||r.date||''):'',postage:'',...r}));save()}function save(){localStorage.setItem(KEY,JSON.stringify(records))}function rememberUndo(){undoSnapshot=JSON.stringify(records);if(typeof undoBtn!=='undefined')undoBtn.disabled=false}function undoLast(){if(!undoSnapshot){alert('没有可以返回的上一个动作');return}records=JSON.parse(undoSnapshot);undoSnapshot=null;save();render();if(typeof undoBtn!=='undefined')undoBtn.disabled=true}function money(v){const n=parseFloat(v);return isNaN(n)?'':`RM${n.toFixed(2)}`}function firstLine(v){return String(v||'').split(/\r?\n/).map(x=>x.trim()).find(Boolean)||''}function fmtDate(v){if(!v)return '';const [y,m,d]=v.split('-');return `${d}/${m}/${y}`}function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function typeClass(t){if(t==='借')return 'borrow';if(t==='开单')return 'invoice';if(t==='大货')return 'bulk';if(t==='Sample')return 'sample';if(t==='换货')return 'exchange';return 'other'}function updateLists(){const line=productLine.value;const current=branch.value;itemList.innerHTML=(productItems[line]||[]).map(x=>`<option value="${esc(x)}"></option>`).join('');branch.innerHTML='<option value="">选择 Branch</option>'+(branchOptions[line]||[]).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if((branchOptions[line]||[]).includes(current)){branch.value=current}item.placeholder=line==='Other'?'输入临时代号':'选择或输入代号'}function knownBranches(){return Array.from(new Set(Object.values(branchOptions).flat()))}function branchName(v){return String(v||'').trim().toUpperCase()}function isKnownBranch(v){return knownBranches().includes(branchName(v))}function categoryMatch(r,cat){if(cat==='全部')return true;if(cat==='未完成')return !r.completed;if(cat==='已完成')return !!r.completed;if(cat==='其它')return !isKnownBranch(r.branch);if(cat==='出货未开单')return r.direction==='Out'&&(r.billStatus||'未开单')==='未开单';if(cat==='进货未开单')return r.direction==='In'&&(r.billStatus||'未开单')==='未开单';if(['大货','开单','借','Sample','换货','其他'].includes(cat))return r.type===cat;return branchName(r.branch)===cat}function categoryCount(cat){return records.filter(r=>categoryMatch(r,cat)).length}function btn(c){return `<button class="cat-btn ${activeCategory===c?'active':''}" onclick="setCategory('${c}')">${c}<span class="cat-count">${categoryCount(c)}</span></button>`}function renderCategories(){const fixed=['全部','未完成','已完成'];const all=knownBranches();const used=Array.from(new Set(records.map(r=>branchName(r.branch)).filter(Boolean).filter(b=>all.includes(b))));const branches=[];if(used.includes('JOEY'))branches.push('JOEY');used.filter(b=>b!=='JOEY').sort().forEach(b=>branches.push(b));const cats=fixed.concat(branches);if(categoryCount('其它')>0)cats.push('其它');if(!cats.includes(activeCategory))activeCategory='全部';categoryTabs.innerHTML=cats.map(btn).join('')}window.setCategory=function(cat){activeCategory=cat;render()};function sortRows(rows){return rows.slice().sort((a,b)=>{if(!!a.completed!==!!b.completed)return a.completed?1:-1;if(a.completed&&b.completed){const da=a.completionDate||a.date||'';const db=b.completionDate||b.date||'';return db.localeCompare(da)}return (b.date||'').localeCompare(a.date||'')})}function filtered(){const q=search.value.trim().toLowerCase();let rows=records.filter(r=>categoryMatch(r,activeCategory));if(q)rows=rows.filter(r=>Object.values(r).join(' ').toLowerCase().includes(q));return sortRows(rows)}function branchNotNeeded(){return ['大货','Sample','换货'].includes(type.value)}function updateBranchVisibility(){const hide=branchNotNeeded();branchField.classList.toggle('hidden',hide);branch.required=!hide;if(hide){branch.value=''}else{updateLists()}}
function render(){renderCategories();const rows=filtered();tbody.innerHTML=rows.map(r=>`<tr class="clickable" onclick="openStatusModal('${r.id}')"><td>${r.completed?fmtDate(r.completionDate||r.date):'<span class="muted">-</span>'}</td><td>${esc(r.productLine)}</td><td class="code">${esc(r.item)}</td><td>${esc(r.qty)}</td><td><span class="tag ${r.direction==='In'?'in':'out'}">${esc(r.direction)}</span></td><td><span class="tag ${typeClass(r.type)}">${esc(r.type)}</span></td><td>${esc(r.branch)||'<span class="muted">-</span>'}</td><td class="code">${esc(firstLine(r.tracking))||'<span class="muted">-</span>'}</td><td class="remark-cell">${esc(r.remark)||'<span class="muted">-</span>'}</td><td>${r.completed?'<span class="tag done">已完成</span>':'<span class="tag pending">未完成</span>'}</td><td>${esc(r.billStatus||'未开单')}</td><td class="money">${money(r.postage)||'RM0.00'}</td><td><button class="btn light small" onclick="event.stopPropagation();editRecord('${r.id}')">编辑</button> <button class="btn danger small" onclick="event.stopPropagation();delRecord('${r.id}')">删除</button></td></tr>`).join('');countText.textContent=`${activeCategory}：${rows.length} 条记录`; sumPending.textContent=records.filter(r=>!r.completed).length;sumOutUnbilled.textContent=records.filter(r=>r.direction==='Out'&&(r.billStatus||'未开单')==='未开单').length;sumInUnbilled.textContent=records.filter(r=>r.direction==='In'&&(r.billStatus||'未开单')==='未开单').length;sumPostage.textContent=`RM ${records.filter(r=>r.direction==='Out').reduce((s,r)=>s+(parseFloat(r.postage)||0),0).toFixed(2)}`}
function clearForm(){form.reset();id.value='';productLine.value='TO';direction.value='Out';type.value='开单';updateLists();updateBranchVisibility();formTitle.textContent='新增记录';saveBtn.textContent='保存';cancelEditBtn.classList.add('hidden')}function setForm(r){id.value=r.id;productLine.value=r.productLine||'TO';updateLists();item.value=r.item||'';qty.value=r.qty||'';direction.value=r.direction||'Out';branch.value=r.branch||'';type.value=r.type||'开单';updateBranchVisibility();remark.value=r.remark||''}function getForm(){return {id:id.value||makeId(),date:new Date().toISOString().slice(0,10),completionDate:'',productLine:productLine.value,item:item.value.trim(),qty:qty.value,direction:direction.value,branch:branchNotNeeded()?'':branch.value.trim(),type:type.value,tracking:id.value?(records.find(x=>x.id===id.value)?.tracking||''):'',remark:remark.value.trim(),completed:false,billStatus:'未开单',invoiceNo:'',paymentDate:'',billDate:'',postage:''}}
window.editRecord=rid=>{openStatusModal(rid)};window.delRecord=rid=>{if(!confirm('确定删除这笔记录？'))return;rememberUndo();records=records.filter(r=>r.id!==rid);save();render()};function updateModalBranch(){const line=modalProductLine.value;const current=modalBranch.value;modalBranch.innerHTML='<option value="">选择 Branch</option>'+(branchOptions[line]||[]).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if((branchOptions[line]||[]).includes(current)){modalBranch.value=current}}function updateModalBranchVisibility(){const hide=['大货','Sample','换货'].includes(modalType.value);modalBranchField.classList.toggle('hidden',hide);modalBranch.required=!hide;if(hide){modalBranch.value=''}else{updateModalBranch()}}function toggleInvoiceExtra(){const r=records.find(x=>x.id===statusId.value);const billed=statusBill.value==='已开单';invoiceExtra.classList.toggle('hidden',!billed);paymentDateField.classList.toggle('hidden',!(billed&&r&&r.direction==='In'))}function openStatusModal(rid){const r=records.find(x=>x.id===rid);if(!r)return;statusId.value=r.id;modalProductLine.value=r.productLine||'TO';updateModalBranch();modalItem.value=r.item||'';modalQty.value=r.qty||'';modalDirection.value=r.direction||'Out';modalType.value=r.type||'开单';modalBranch.value=r.branch||'';updateModalBranchVisibility();modalRemark.value=r.remark||'';statusTracking.value=r.tracking||'';statusCompleted.value=String(!!r.completed);statusCompletionDate.value=r.completionDate||'';statusBill.value=r.billStatus||'未开单';statusPostage.value=r.postage||'';invoiceNo.value=r.invoiceNo||'';paymentDate.value=r.paymentDate||'';billDate.value=r.billDate||'';toggleInvoiceExtra();statusModal.classList.add('show')}function closeStatusModal(){statusModal.classList.remove('show')}modalProductLine.onchange=updateModalBranchVisibility;modalType.onchange=updateModalBranchVisibility;modalDirection.onchange=toggleInvoiceExtra;statusBill.onchange=toggleInvoiceExtra;statusCloseBtn.onclick=closeStatusModal;statusCancelBtn.onclick=closeStatusModal;statusForm.onsubmit=e=>{e.preventDefault();const r=records.find(x=>x.id===statusId.value);if(!r)return;if(!modalProductLine.value||!modalItem.value.trim()||!modalQty.value||!modalDirection.value||!modalType.value||(!['大货','Sample','换货'].includes(modalType.value)&&!modalBranch.value)){alert('请填写所有必填项目');return}rememberUndo();r.productLine=modalProductLine.value;r.item=modalItem.value.trim();r.qty=modalQty.value;r.direction=modalDirection.value;r.type=modalType.value;r.branch=['大货','Sample','换货'].includes(modalType.value)?'':modalBranch.value;r.remark=modalRemark.value.trim();r.tracking=statusTracking.value.trim();r.completed=statusCompleted.value==='true';r.completionDate=r.completed?(statusCompletionDate.value||new Date().toISOString().slice(0,10)):'';r.billStatus=statusBill.value;r.postage=statusPostage.value;r.invoiceNo=invoiceNo.value.trim();r.paymentDate=paymentDate.value;r.billDate=billDate.value;if(r.billStatus!=='已开单'){r.invoiceNo='';r.paymentDate='';r.billDate=''}if(r.direction!=='In'){r.paymentDate=''}save();render();closeStatusModal()};
form.onsubmit=e=>{e.preventDefault();const r=getForm();if(!r.productLine||!r.item||!r.qty||!r.direction||!r.type||(!branchNotNeeded()&&!r.branch)){alert('请填写所有必填项目');return}const i=records.findIndex(x=>x.id===r.id);rememberUndo();if(i>=0){records[i]={...records[i],...r}}else records.unshift(r);save();clearForm();render()};productLine.onchange=()=>{updateLists();updateBranchVisibility()};type.onchange=updateBranchVisibility;search.oninput=render;cancelEditBtn.onclick=clearForm;undoBtn.onclick=undoLast;undoBtn.disabled=true;resetBtn.onclick=()=>{if(confirm('恢复示例会清除目前浏览器里的记录，确定？')){rememberUndo();records=sample;save();clearForm();render()}};exportBtn.onclick=()=>{const headers=['完成日期','产品系统','Item代号','Qty','In/Out','类型','Branch','Tracking / Delivery','Remark','完成状态','开单状态','Invoice No','Payment Date','开单日期','邮费'];const csv=[headers.join(',')].concat(records.map(r=>[r.completed?(r.completionDate||r.date):'',r.productLine,r.item,r.qty,r.direction,r.type,r.branch,r.tracking||'',r.remark,r.completed?'已完成':'未完成',r.billStatus||'未开单',r.invoiceNo||'',r.paymentDate||'',r.billDate||'',r.postage||''].map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(','))).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='MZM_进出货记录.csv';a.click();URL.revokeObjectURL(a.href)};load();clearForm();render();
